name: Release Multi-Platform NEXOUYA PAD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC Build
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

          # Linux Universal Build (Debian/Ubuntu, Arch, Fedora, KDE/GNOME/Hyprland)
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri 2 Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'NEXOUYA PAD v__VERSION__'
          releaseBody: |
            ## NEXOUYA PAD Desktop Release v__VERSION__

            ### ✨ What's New:
            - **Native OS File Dialogs:** Real Windows Explorer and Linux GTK Save As dialog with folder navigation and no forced extensions.
            - **Cross-Platform Linux & Windows Binaries:** Ready-to-use Windows `.msi` / `.exe` installer and Linux `.deb` / AppImage bundles.
            - **Rust Memory-Mapped Core (`mmap`):** Open multi-gigabyte files instantly with zero UI freezing.
            - **True VS Code Syntax Highlighting:** Real tokenization for JavaScript, TypeScript, Python, Rust, YAML, Markdown, HTML, and CSS.
            - **Clean Desktop Aesthetics:** Precision typography, dark studio theme, find & replace bar, and crash-resilient tabs.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
