[package]
name = "nexouya-pad"
version = "0.4.0"
description = "NEXOUYA PAD - Professional high-performance desktop editor with Rust mmap and native OS dialogs"
authors = ["nexouya"]
license = "MIT"
repository = "https://github.com/nexouya/nexouya-pad"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
memmap2 = "0.9"
rfd = "0.15"
